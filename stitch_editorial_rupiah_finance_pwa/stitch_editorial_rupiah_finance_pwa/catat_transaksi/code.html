tainer":"#a3faef","on-primary-fixed":"#00201d","surface-tint":"#006a63","primary-fixed-dim":"#80d5cb","surface-bright":"#fff8f5","tertiary-container":"#087a38","surface-container-lowest":"#ffffff","ink":"#1C1917","draft-surface":"#FEF3C7"},borderRadius:{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},spacing:{"margin":"1rem","space-md":"0.75rem","space-lg":"1rem","gutter":"1rem","space-xl":"1.5rem","space-xs":"0.25rem","space-sm":"0.5rem"},fontFamily:{"headline-hero":["Plus Jakarta Sans"],"label-micro":["Plus Jakarta Sans"],"headline-section":["Plus Jakarta Sans"],"body-muted":["Plus Jakarta Sans"],"headline-hero-mobile":["Plus Jakarta Sans"],"body-default":["Plus Jakarta Sans"],"headline-page":["Plus Jakarta Sans"]},fontSize:{"headline-hero":["38px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"600"}],"label-micro":["11px",{"lineHeight":"14px","fontWeight":"500"}],"headline-section":["16px",{"lineHeight":"24px","fontWeight":"600"}],"body-muted":["13px",{"lineHeight":"18px","fontWeight":"400"}],"headline-hero-mobile":["36px",{"lineHeight":"42px","letterSpacing":"-0.02em","fontWeight":"600"}],"body-default":["15px",{"lineHeight":"22px","fontWeight":"500"}],"headline-page":["22px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"600"}]}}}}</script></head><body class="bg-canvas text-ink font-body-default min-h-screen flex flex-col items-center selection:bg-accent-surface selection:text-primary"><div class="w-full max-w-[390px] min-h-screen flex flex-col relative"><header class="fixed top-0 max-w-[390px] w-full z-50 pt-safe bg-canvas/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Tutup" class="w-11 h-11 flex items-center justify-center rounded-full text-ink hover:bg-surface/50 active:bg-secondary-fixed transition-colors" type="button"><span class="material-symbols-outlined text-[24px]">close</span></button><h1 class="font-headline-page text-headline-page text-ink tracking-tight">Catat</h1></div><div class="flex items-center gap-space-xs"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 shadow-[0_1px_3px_0_rgba(28,25,23,0.04)]"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-14 pb-[84px] bg-canvas"><div class="flex flex-col w-full pb-3 select-none">
<!-- 1. Segmented Control -->
<div class="w-full flex justify-center pt-1 pb-2">
<div class="inline-flex p-1 bg-surface-container-high rounded-full w-full max-w-[280px]">
<button class="flex-1 py-1.5 px-4 rounded-full font-body-default text-body-default font-semibold text-on-primary bg-primary transition-all duration-200 text-center shadow-sm" id="tab-keluar" type="button">
        Keluar

<button class="flex-1 py-1.5 px-4 rounded-full font-body-default text-body-default font-medium text-secondary hover:text-ink transition-all duration-200 text-center" id="tab-masuk" type="button">
        Masuk
      </button>
</div>
</div>
<!-- 2. Centered Amount Display with Delightful Micro-Pulse -->
<div class="flex flex-col items-center justify-center py-4 relative">
<div class="flex items-baseline justify-center gap-0.5 tracking-tight">
<span class="font-headline-hero-mobile text-headline-hero-mobile text-ink font-semibold tracking-tighter tabular-nums" id="amount-display">Rp25.000</span>
<span class="w-0.5 h-7 bg-primary-container inline-block animate-pulse rounded-full ml-1 align-middle"></span>
</div>
<span class="font-label-micro text-label-micro text-muted-ink mt-1 font-medium tracking-wide">Pengeluaran harian</span>
</div>
<!-- 3. Account Selection Row -->
<div class="w-full px-1 mb-2">
<button class="w-full h-11 px-4 bg-surface rounded-xl flex items-center justify-between shadow-sm active:scale-[0.99] transition-all duration-150" type="button">
<div class="flex items-center gap-2.5">
<div class="w-7 h-7 rounded-full bg-accent-surface flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-[17px]">account_balance_wallet</span>
</div>
<span class="font-body-default text-body-default text-ink font-medium">Dompet Tunai</span>
</div>
<div class="flex items-center gap-1 text-muted-ink">
<span class="font-body-muted text-body-muted text-muted-ink">Utama</span>
<span class="material-symbols-outlined text-[18px]">chevron_right</span>
</div>
</button>
</div>
<!-- 4. Single-line Note Field -->
<div class="w-full px-1 mb-3">
<div class="w-full h-11 px-4 bg-surface rounded-xl flex items-center shadow-sm">
<span class="material-symbols-outlined text-muted-ink text-[18px] mr-2 shrink-0">edit_note</span>
<input class="w-full bg-transparent font-body-default text-body-default text-ink placeholder:text-muted-ink focus:outline-none" id="note-input" placeholder="Catatan, opsional" type="text">
</div>
</div>
<!-- 5. Horizontal Category Chip Row -->
<div class="w-full mb-3">
<div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 px-1">
<button class="cat-chip shrink-0 h-9 px-4 rounded-full font-body-muted text-body-muted font-semibold bg-primary-container text-on-primary shadow-sm flex items-center gap-1.5 transition-all" data-cat="makan" type="button">
<span class="material-symbols-outlined text-[16px]">restaurant</span>
<span class="">Makan</span>
</button>
<button class="cat-chip shrink-0 h-9 px-3.5 rounded-full font-body-muted text-body-muted font-medium bg-surface text-secondary hover:text-ink shadow-sm flex items-center gap-1.5 transition-all" data-cat="transport" type="button">
<span class="material-symbols-outlined text-[16px]">directions_subway</span>
<span class="">Transport</span>
</button>
<button class="cat-chip shrink-0 h-9 px-3.5 rounded-full font-body-muted text-body-muted font-medium bg-surface text-secondary hover:text-ink shadow-sm flex items-center gap-1.5 transition-all" data-cat="belanja" type="button">
<span class="material-symbols-outlined text-[16px]">shopping_bag</span>
<span class="">Belanja</span>
</button>
<button class="cat-chip shrink-0 h-9 px-3.5 rounded-full font-body-muted text-body-muted font-medium bg-surface text-secondary hover:text-ink shadow-sm flex items-center gap-1.5 transition-all" data-cat="tagihan" type="button">
<span class="material-symbols-outlined text-[16px]">receipt</span>
<span class="">Tagihan</span>
</button>
<button class="cat-chip shrink-0 h-9 px-3.5 rounded-full font-body-muted text-body-muted font-medium bg-surface text-secondary hover:text-ink shadow-sm flex items-center gap-1.5 transition-all" data-cat="gaji" type="button">
<span class="material-symbols-outlined text-[16px]">payments</span>
<span class="">Gaji</span>
</button>
</div>
</div>
<!-- 6. 3x4 Numeric Keypad (Optimized for One-Thumb Reach) -->
<div class="w-full grid grid-cols-3 gap-2 px-1 mb-3">
<!-- Row 1 -->
<button class="key-btn h-12 bg-surface hover:bg-surface-container active:bg-secondary-fixed rounded-xl font-headline-section text-headline-section font-semibold text-ink shadow-sm flex items-center justify-center tabular-nums transition-transform active:scale-95" data-key="1" type="button">1</button>
<button class="key-btn h-12 bg-surface hover:bg-surface-container active:bg-secondary-fixed rounded-xl font-headline-section text-headline-section font-semibold text-ink shadow-sm flex items-center justify-center tabular-nums transition-transform active:scale-95" data-key="2" type="button">2</button>
<button class="key-btn h-12 bg-surface hover:bg-surface-container active:bg-secondary-fixed rounded-xl font-headline-section text-headline-section font-semibold text-ink shadow-sm flex items-center justify-center tabular-nums transition-transform active:scale-95" data-key="3" type="button">3</button>
<!-- Row 2 -->
<button class="key-btn h-12 bg-surface hover:bg-surface-container active:bg-secondary-fixed rounded-xl font-headline-section text-headline-section font-semibold text-ink shadow-sm flex items-center justify-center tabular-nums transition-transform active:scale-95" data-key="4" type="button">4</button>
<button class="key-btn h-12 bg-surface hover:bg-surface-container active:bg-secondary-fixed rounded-xl font-headline-section text-headline-section font-semibold text-ink shadow-sm flex items-center justify-center tabular-nums transition-transform active:scale-95" data-key="5" type="button">5</button>
<button class="key-btn h-12 bg-surface hover:bg-surface-container active:bg-secondary-fixed rounded-xl font-headline-section text-headline-section font-semibold text-ink shadow-sm flex items-center justify-center tabular-nums transition-transform active:scale-95" data-key="6" type="button">6</button>
<!-- Row 3 -->
<button class="key-btn h-12 bg-surface hover:bg-surface-container active:bg-secondary-fixed rounded-xl font-headline-section text-headline-section font-semibold text-ink shadow-sm flex items-center justify-center tabular-nums transition-transform active:scale-95" data-key="7" type="button">7</button>
<button class="key-btn h-12 bg-surface hover:bg-surface-container active:bg-secondary-fixed rounded-xl font-headline-section text-headline-section font-semibold text-ink shadow-sm flex items-center justify-center tabular-nums transition-transform active:scale-95" data-key="8" type="button">8</button>
<button class="key-btn h-12 bg-surface hover:bg-surface-container active:bg-secondary-fixed rounded-xl font-headline-section text-headline-section font-semibold text-ink shadow-sm flex items-center justify-center tabular-nums transition-transform active:scale-95" data-key="9" type="button">9</button>
<!-- Row 4 -->
<button class="key-btn h-12 bg-surface hover:bg-surface-container active:bg-secondary-fixed rounded-xl font-body-default text-body-default font-semibold text-secondary shadow-sm flex items-center justify-center tabular-nums transition-transform active:scale-95" data-key="000" type="button">000</button>
<button class="key-btn h-12 bg-surface hover:bg-surface-container active:bg-secondary-fixed rounded-xl font-headline-section text-headline-section font-semibold text-ink shadow-sm flex items-center justify-center tabular-nums transition-transform active:scale-95" data-key="0" type="button">0</button>
<button aria-label="Hapus digit" class="key-btn h-12 bg-surface hover:bg-surface-container active:bg-secondary-fixed rounded-xl text-secondary shadow-sm flex items-center justify-center transition-transform active:scale-95" data-key="back" type="button">
<span class="material-symbols-outlined text-[20px]">backspace</span>
</button>
</div>
<!-- 7. Full-width Primary CTA Button -->
<div class="w-full px-1">
<button class="w-full h-12 rounded-xl bg-primary-container text-on-primary font-body-default text-body-default font-semibold shadow-sm active:bg-accent-active active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="btn-save" type="button">
<span class="material-symbols-outlined text-[20px]">check</span>
<span class="">Simpan</span>
</button>
</div>
</div>
<script>
  (() => {
    let currentRaw = '25000';
    const displayEl = document.getElementById('amount-display');
    const tabKeluar = document.getElementById('tab-keluar');
    const tabMasuk = document.getElementById('tab-masuk');
    const chips = document.querySelectorAll('.cat-chip');
    const keys = document.querySelectorAll('.key-btn');
    const saveBtn = document.getElementById('btn-save');

    function formatRupiah(str) {
      if (!str || str === '0') return 'Rp0';
      const num = parseInt(str, 10);
      if (isNaN(num)) return 'Rp0';
      return 'Rp' + num.toLocaleString('id-ID');
    }

    function updateDisplay() {
      displayEl.textContent = formatRupiah(currentRaw);
    }

    // Keypad clicks
    keys.forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-key');
        if (key === 'back') {
          if (currentRaw.length > 1) {
            currentRaw = currentRaw.slice(0, -1);
          } else {
            currentRaw = '0';
          }
        } else if (key === '000') {
          if (currentRaw !== '0' && currentRaw.length <= 9) {
            currentRaw += '000';
          }
        } else {
          if (currentRaw === '0') {
            currentRaw = key;
          } else if (currentRaw.length <= 11) {
            currentRaw += key;
          }
        }
        updateDisplay();
      });
    });

    // Segmented control toggle
    tabKeluar.addEventListener('click', () => {
      tabKeluar.className = "flex-1 py-1.5 px-4 rounded-full font-body-default text-body-default font-semibold text-on-primary bg-primary transition-all duration-200 text-center shadow-sm";
      tabMasuk.className = "flex-1 py-1.5 px-4 rounded-full font-body-default text-body-default font-medium text-secondary hover:text-ink transition-all duration-200 text-center";
    });

    tabMasuk.addEventListener('click', () => {
      tabMasuk.className = "flex-1 py-1.5 px-4 rounded-full font-body-default text-body-default font-semibold text-on-primary bg-primary transition-all duration-200 text-center shadow-sm";
      tabKeluar.className = "flex-1 py-1.5 px-4 rounded-full font-body-default text-body-default font-medium text-secondary hover:text-ink transition-all duration-200 text-center";
    });

    // Category chip selection
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chips.forEach(c => {
          c.className = "cat-chip shrink-0 h-9 px-3.5 rounded-full font-body-muted text-body-muted font-medium bg-surface text-secondary hover:text-ink shadow-sm flex items-center gap-1.5 transition-all";
        });
        chip.className = "cat-chip shrink-0 h-9 px-4 rounded-full font-body-muted text-body-muted font-semibold bg-primary-container text-on-primary shadow-sm flex items-center gap-1.5 transition-all";
      });
    });

    // Tactile Feedback on Save
    saveBtn.addEventListener('click', () => {
      const originalHTML = saveBtn.innerHTML;
      saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Tersimpan...</span>';
      setTimeout(() => {
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">done_all</span><span>Berhasil Dicatat</span>';
        saveBtn.classList.remove('bg-primary-container');
        saveBtn.classList.add('bg-tertiary-container');
        setTimeout(() => {
          currentRaw = '0';
          updateDisplay();
          saveBtn.innerHTML = originalHTML;
          saveBtn.classList.add('bg-primary-container');
          saveBtn.classList.remove('bg-tertiary-container');
        }, 1200);
      }, 400);
    });
  })();
</script></main><nav class="fixed bottom-0 max-w-[390px] w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.05)]" data-active-classes="text-primary-container font-semibold"><div class="h-16 max-w-[390px] mx-auto px-margin grid grid-cols-3 items-center"><a class="flex flex-col items-center justify-center min-h-[44px] h-full gap-1 text-muted-ink transition-colors hover:text-ink" data-path="beranda" href="#"><span class="material-symbols-outlined text-[24px]">home</span><span class="font-label-micro text-label-micro tracking-tight">Beranda</span></a><a aria-current="page" class="flex flex-col items-center justify-center min-h-[44px] h-full gap-1 transition-colors text-primary-container font-semibold" data-path="catat" href="#"><span class="material-symbols-outlined text-[24px]">receipt_long</span><span class="font-label-micro text-label-micro tracking-tight">Catat</span></a><a class="flex flex-col items-center justify-center min-h-[44px] h-full gap-1 text-muted-ink transition-colors hover:text-ink" data-path="akun" href="#"><span class="material-symbols-outlined text-[24px]">account_circle</span><span class="font-label-micro text-label-micro tracking-tight">Akun</span></a></div></nav></div>

</body></html>
